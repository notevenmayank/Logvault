services:
  - type: web
    name: sentinel-vault-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard_app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_TO_NUMBER
        sync: false
